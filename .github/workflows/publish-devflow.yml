name: Publish devflow-mcp-server

# One-shot bridge, and it exists for a reason worth writing down.
#
# DevFlow 3.0.0 renamed this project's npm package to `devflow-mcp-server`
# (`devflow-mcp` was taken on npm by an unrelated publisher). Its own release
# workflow does the publish — but the npm account's 2FA passkey is currently
# unavailable, so no new token can be minted, and a secret that already exists
# cannot be read back out of GitHub by design.
#
# This repo still holds a working NPM_TOKEN. So rather than extract that secret,
# the publish comes to the token: this job checks out DevFlow at its release tag
# and publishes from here. The token never leaves the runner.
#
# Deliberately no `--provenance`. Provenance attests that a package was built by
# the repo named in its `package.json`, which is DevFlow, not Flow-Recorder —
# npm rejects the mismatch. 3.0.1 gets its signature back once DevFlow's own
# workflow can authenticate.
#
# DELETE THIS FILE once devflow-mcp-server@3.0.0 is on npm.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The DevFlow tag to publish from
        required: true
        default: v3.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # DevFlow is public, so the default token reads it fine.
      - uses: actions/checkout@v4
        with:
          repository: ansh-n-chovatiya/DevFlow
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that NODE_AUTH_TOKEN slots into below.
          registry-url: https://registry.npmjs.org

      # The root postinstall runs `npm --prefix mcp-server ci`, which is what
      # puts the server's own dependencies on disk. There are no workspaces.
      - run: npm ci

      # Produces mcp-server/core.js — `src/core/` bundled as plain Node ESM.
      # It is listed in `files`, and npm does not complain about a listed file
      # that is missing, so without the build the published server throws
      # ERR_MODULE_NOT_FOUND on its first tool call and only for users.
      - run: npm run build:mcp

      - name: Publish
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f core.js ]; then
            echo "::error::mcp-server/core.js is missing — the build did not run."
            exit 1
          fi

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ inputs.ref }}"

          # Publishing a version that disagrees with the tag it was cut from is
          # how "which one do I have" stops being answerable.
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::${NAME}@${VERSION} does not match tag ${TAG}."
            exit 1
          fi

          # Guards against a re-run failing the job on "cannot publish over
          # previously published versions" — red for a release already correct.
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)" ]; then
            echo "::notice::${NAME}@${VERSION} is already on npm — nothing to do."
            exit 0
          fi

          echo "Publishing ${NAME}@${VERSION} from ${TAG}."
          npm publish --access public
